server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Configuração para o Fly.io - Proxy para o backend
    # Captura todas as requisições que começam com /api/v1
    location /api/v1 {
        # URL do backend no Fly.io (sem barra final para preservar o caminho completo)
        proxy_pass https://backend-weathered-morning-8536.fly.dev;
        
        # Estas linhas são obrigatórias para funcionar com HTTPS externo
        proxy_ssl_server_name on;
        proxy_set_header Host backend-weathered-morning-8536.fly.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts para requisições longas
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Evita problemas com redirecionamentos
        proxy_redirect off;
    }
}